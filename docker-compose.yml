#version: '3.8'
services:
  test-api:
    build: .
    restart: always
    image: test-api
    container_name: test-api
    # ELIMINA la línea de "ports" - Traefik no necesita que mapees puertos manualmente
    # ports:
    #   - "7030:7030"
    command: bun run start
    #networks:
    #  - web # Asegúrate de que esté en la misma red donde está Traefik
    labels:
      - "traefik.enable=true"
      # Define el dominio para esta API
      - "traefik.http.routers.test-api.rule=Host(`testapi.drogueriajoskar.com`)"
      # Define el entrypoint (ajusta a 'websecure' si usas HTTPS)
      - "traefik.http.routers.test-api.entrypoints=websecure"
      # Indica el puerto interno en el que tu app está escuchando (tu const port = 7030)
      - "traefik.http.services.test-api.loadbalancer.server.port=7030"
      # Si usas TLS/SSL con Traefik, activa tu resolver
      - "traefik.http.routers.test-api.tls=true"
      - "traefik.http.routers.test-api.tls.certresolver=myresolver" # Ajusta según tu nombre de resolver
    environment:
      - TZ=America/Caracas
      - PORT=7030                  
      - DB_HOST=${DB_HOST}         
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - DB_WEB_NAME=${DB_NAME_PO}
      - DB_PORT=${DB_PORT}
      - DB_HOST_SFTP_CREATOR=${DB_HOST}
      - DB_USER_SFTP_CREATOR=${DB_USER}
      - DB_PASSWORD_SFTP_CREATOR=${DB_PASS}
      - DB_NAME_SFTP_CREATOR=${DB_NAME}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - API_JOSKAR_URL=${API_JOSKAR_URL}
      #- CORS_ORIGIN=https://www.drogueriajoskar.com,https://cliente.drogueriajoskar.com,https://admin.drogueriajoskar.com,http://joskarerp.drogueriajoskar.com
      - CORS_ORIGIN=*
      - SSL_KEY_PATH=./ssl/privkey.pem  
      - SSL_CERT_PATH=./ssl/fullchain.pem 

      